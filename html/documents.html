<!DOCTYPE html>

    <head>
        <meta charset="utf-8" >

        <!-- INFO : Google Fonts -->

        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">

        <!-- INFO : CSS -->

        <!-- INFO : JS -->

        <script src="../js/formulaire-modif.js" defer></script>
        
        <title>Portoflio de joao paulo</title>

    <body>
        
        <!-- INFO : bannière des pages -->
        <header>
            <nav class="bulle_principal">   
                <div class="bulle_action" id="nav_bulle">
                    <span>bulle</span>
                </div>

                <div class="bulle_action mobil millieux" id="nav_documents_mobil">
                    <span class="nom_afichage">pseudo</span><br>
                    <span class="age_afichage">nombre</span><br>
                    <span>cv</span>
                </div>

                <div class="bulle_action PC" id="nav_documents_pc">
                    <span class="nom_afichage">pseudo</span>
                    <span>-</span>
                    <span class="age_afichage">nombre</span>
                    <span>-</span>
                    <span>cv</span>
                </div>                            

                <div class="bulle_action"  id="nav_outil">
                    <span>outil</span>
                </div>
            </nav>
        </header>

       <!---- INFO : contenu de la page  ---->
        <main>
            <div class="bulle_secondaire">

            <section>
                <h1>- modifier info -</h1>
                
                <form action="" method="get" class="formulaire__modife">
                    <fieldset>
                    <legend>modifier info perso</legend>
                    <label for="prenom">prenom :</label>
                    <input type="text" name="nom" id="modife__prenom">

                    <label for="age">age :</label>
                    <input type="number" name="age" id="modife__age">

                    <button type="button" class="btn_base" id="btn_modif">Valider</button>
                    </fieldset>
                </form>
            </section>

            <section>
                <h1>- Documents -</h1>

                <div class="bulle_info">
                    <h2>📄 CV</h2>

                    <a href="../doc/cv-joao-paulo.pdf" download> Télécharger mon CV </a>
                </div>

                <div class="bulle_info">
                    <h2>📄 lettre de motivation</h2>

                    <a href="../doc/lettre-motivation-joao-paulo.pdf" download> Télécharger ma lettre de motivation </a>
                </div>
            </section>

            <section>
                <h1>- déconnexion  -</h1>
            </section>
        </main>

        <!---- INFO : Pied de page lien pour réseaux sociaux  ---->
        <footer>
            <nav class="bulle_lien">
                <h3>~ Réseaux sociaux ~</h3>

                <a target="_blank" href="https://www.instagram.com/kaikyo_ars/" class="tooltip-container">
                    <img class="logo" src="../img/insta.png" alt="Insta"/>
                    <span class="tooltip-text">Insta</span>
                </a>

                <a target="_blank"href="https://www.youtube.com/@Kaikyo_Plays" class="tooltip-container">

                </a>

                <a target="_blank"href="https://github.com/jp-kaikyo" class="tooltip-container">
                    <img class="logo" src="../img/github.png" alt="Github"/>
                    <span class="tooltip-text">Github</span>
                </a>

                <a target="_blank" href="https://www.twitch.tv/kaikyo_plays" class="tooltip-container">
                    <img class="logo" src="../img/twitch.png" alt="Twitch"/>
                    <span class="tooltip-text">Twitch</span>
                </a>

                <a target="_blank" href="https://www.tiktok.com/@kaikyo_dev?lang=fr" class="tooltip-container">

                    <span class="tooltip-text">Tiktok</span>
